[package]
name = "cornercase-mobile"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "cornercase_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
cornercase-core = { path = "../crates/core", features = ["specta"] }
keyring-core = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
specta = { workspace = true }
specta-typescript = "=0.0.13"
tauri = { version = "2.12", features = ["specta"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["protected"] }

[dev-dependencies]
cornercase-core = { path = "../crates/core", features = ["test-util"] }
rstest = "0.27.0"
serde_json = "1.0.154"

[lints]
workspace = true

[package]
name = "cornercase-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
cornercase-core = { path = "../crates/core" }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
rustix = { version = "1.1.5", features = ["fs", "process"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["process", "io-util", "rt", "sync", "time", "macros", "net", "signal"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[features]
test-util = []

[dev-dependencies]
cornercase-bridge = { path = ".", features = ["test-util"] }
rstest = "0.27.0"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }

[lints]
workspace = true

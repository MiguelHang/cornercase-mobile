[package]
name = "cornercase-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
cornercase-core = { path = "../crates/core" }
rustix = { version = "1.1.5", features = ["process"] }
tokio = { version = "1.54.1", features = ["process", "io-util", "rt", "sync", "time", "macros"] }

[dev-dependencies]
rstest = "0.27.0"

[lints]
workspace = true
